android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# React Native 0.76 required property: tells the build system
# this project uses the new architecture entry point wiring.
# Keep as false unless New Architecture (Fabric/TurboModules) is fully enabled.
newArchEnabled=false

# Hermes JS Engine (required in RN 0.76 — JSC is removed)
hermesEnabled=true

# Android build cache for faster incremental builds
org.gradle.caching=true
org.gradle.parallel=true
