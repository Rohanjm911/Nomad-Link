<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="380">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#070a0e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <style>
      .radar-sweep-group {
        transform-origin: 210px 190px;
        animation: rotateSweep 4s linear infinite;
      }
      .node-ping-1 {
        transform-origin: 280px 140px;
        animation: pingEffect 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .node-ping-2 {
        transform-origin: 150px 240px;
        animation: pingEffect 2s cubic-bezier(0, 0.2, 0.8, 1) 0.7s infinite;
      }
      .node-ping-3 {
        transform-origin: 270px 250px;
        animation: pingEffect 2s cubic-bezier(0, 0.2, 0.8, 1) 1.3s infinite;
      }
      .hud-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        font-size: 11px;
        fill: #94a3b8;
      }
      .hud-highlight {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        font-size: 12px;
        font-weight: 700;
        fill: #38bdf8;
      }
      .hud-tag {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        font-size: 10px;
        font-weight: 600;
      }
      .pulse-line {
        stroke: #38bdf8;
        stroke-dasharray: 4 4;
        animation: pulseLine 1.5s linear infinite;
      }
      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pingEffect {
        0% { r: 3px; opacity: 1; stroke-width: 2px; }
        100% { r: 24px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes pulseLine {
        to { stroke-dashoffset: -16; }
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="848" height="378" x="1" y="1" rx="14" fill="#070a0e" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Left: Circular Radar Scope (Center at 210, 190) -->
  <g id="RadarScope">
    <!-- Outer Scope Ring -->
    <circle cx="210" cy="190" r="160" fill="url(#radarGlow)" stroke="#1e293b" stroke-width="2"/>
    <!-- Range Rings -->
    <circle cx="210" cy="190" r="120" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3 3"/>
    <circle cx="210" cy="190" r="80" fill="none" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="210" cy="190" r="40" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="3 3"/>

    <!-- Crosshair Axes -->
    <line x1="210" y1="30" x2="210" y2="350" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="50" y1="190" x2="370" y2="190" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Degree Markings -->
    <text x="210" y="24" text-anchor="middle" class="hud-tag" fill="#64748b">000° [N]</text>
    <text x="382" y="194" text-anchor="start" class="hud-tag" fill="#64748b">090° [E]</text>
    <text x="210" y="366" text-anchor="middle" class="hud-tag" fill="#64748b">180° [S]</text>
    <text x="36" y="194" text-anchor="end" class="hud-tag" fill="#64748b">270° [W]</text>

    <!-- Range Markers -->
    <text x="214" y="153" class="hud-tag" fill="#475569">40m</text>
    <text x="214" y="113" class="hud-tag" fill="#475569">80m</text>
    <text x="214" y="73" class="hud-tag" fill="#475569">120m</text>

    <!-- Rotating Radar Sweep Cone -->
    <g class="radar-sweep-group">
      <path d="M 210 190 L 370 190 A 160 160 0 0 0 323 77 Z" fill="url(#sweepBeam)"/>
      <line x1="210" y1="190" x2="370" y2="190" stroke="#38bdf8" stroke-width="2"/>
    </g>

    <!-- Mesh Lines Connecting Peers -->
    <line x1="210" y1="190" x2="280" y2="140" stroke="#0284c7" stroke-width="1.5" opacity="0.7"/>
    <line x1="280" y1="140" x2="270" y2="250" class="pulse-line" stroke-width="1.2" opacity="0.6"/>
    <line x1="210" y1="190" x2="150" y2="240" stroke="#0284c7" stroke-width="1.5" opacity="0.7"/>

    <!-- Center Host Node (You) -->
    <circle cx="210" cy="190" r="5" fill="#38bdf8"/>
    <circle cx="210" cy="190" r="8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="212" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700" fill="#f8fafc">LOCAL NODE</text>

    <!-- Discovered Peer 1: Convoy Lead -->
    <circle class="node-ping-1" cx="280" cy="140" r="4" fill="none" stroke="#10b981"/>
    <circle cx="280" cy="140" r="4" fill="#10b981"/>
    <text x="290" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700" fill="#10b981">CONVOY-LEAD</text>
    <text x="290" y="150" class="hud-tag" fill="#64748b">-58 dBm · BLE 5</text>

    <!-- Discovered Peer 2: Scout Unit -->
    <circle class="node-ping-2" cx="150" cy="240" r="4" fill="none" stroke="#38bdf8"/>
    <circle cx="150" cy="240" r="4" fill="#38bdf8"/>
    <text x="75" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700" fill="#38bdf8">SCOUT-ALPHA</text>
    <text x="75" y="256" class="hud-tag" fill="#64748b">-72 dBm · P2P</text>

    <!-- Discovered Peer 3: Tail Rider -->
    <circle class="node-ping-3" cx="270" cy="250" r="4" fill="none" stroke="#f59e0b"/>
    <circle cx="270" cy="250" r="4" fill="#f59e0b"/>
    <text x="282" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" font-weight="700" fill="#f59e0b">TAIL-SWEEPER</text>
    <text x="282" y="266" class="hud-tag" fill="#64748b">RELAY · HOP 2</text>
  </g>

  <!-- Right: Live Telemetry & Threat Defense Feed -->
  <g transform="translate(430, 30)">
    <!-- Section Title -->
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800" fill="#f8fafc" letter-spacing="1.5">REAL-TIME MESH RADAR &amp; TELEMETRY</text>
    <line x1="0" y1="30" x2="380" y2="30" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Telemetry Cards -->
    <!-- Card 1: Radio Link Status -->
    <g transform="translate(0, 45)">
      <rect width="380" height="56" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="28" r="4" fill="#10b981"/>
      <text x="36" y="24" class="hud-highlight">RADIO TRANSPORTS</text>
      <text x="36" y="42" class="hud-text">BLE 5.4 Peripheral + Central · Wi-Fi Direct Group Owner</text>
      <rect x="290" y="16" width="75" height="24" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="327" y="32" class="hud-tag" fill="#10b981" text-anchor="middle">ACTIVE</text>
    </g>

    <!-- Card 2: E2EE Session Security -->
    <g transform="translate(0, 112)">
      <rect width="380" height="56" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="28" r="4" fill="#38bdf8"/>
      <text x="36" y="24" class="hud-highlight">ENCRYPTION ENGINE</text>
      <text x="36" y="42" class="hud-text">Ed25519 Identity · X25519 ECDH · ChaCha20-Poly1305 MAC</text>
      <rect x="290" y="16" width="75" height="24" rx="4" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
      <text x="327" y="32" class="hud-tag" fill="#38bdf8" text-anchor="middle">SECURED</text>
    </g>

    <!-- Card 3: Dead Reckoning -->
    <g transform="translate(0, 179)">
      <rect width="380" height="56" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="28" r="4" fill="#f59e0b"/>
      <text x="36" y="24" class="hud-highlight">INERTIAL NAVIGATION</text>
      <text x="36" y="42" class="hud-text">3-Axis Accel + Gyro + Magnetometer Compass Fusion</text>
      <rect x="290" y="16" width="75" height="24" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
      <text x="327" y="32" class="hud-tag" fill="#f59e0b" text-anchor="middle">FUSED 98%</text>
    </g>

    <!-- Card 4: Store & Forward DTN Queue -->
    <g transform="translate(0, 246)">
      <rect width="380" height="56" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <circle cx="20" cy="28" r="4" fill="#8b5cf6"/>
      <text x="36" y="24" class="hud-highlight">DTN STORE-AND-FORWARD</text>
      <text x="36" y="42" class="hud-text">Bounded Queue: 200 Max · Loop Suppressed · Max 7 Hops</text>
      <rect x="290" y="16" width="75" height="24" rx="4" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
      <text x="327" y="32" class="hud-tag" fill="#a78bfa" text-anchor="middle">ROUTING</text>
    </g>
  </g>
</svg>
