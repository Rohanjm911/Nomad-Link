<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <!-- Packet Movement Animation -->
    <style>
      .packet-dot {
        fill: #38bdf8;
        filter: drop-shadow(0 0 6px #38bdf8);
      }
      .packet-1 {
        animation: travelHop1 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .packet-2 {
        animation: travelHop2 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .hop-wire {
        stroke: #1e293b;
        stroke-width: 2.5;
        stroke-dasharray: 6 6;
      }
      .hop-wire-active {
        stroke: #0284c7;
        stroke-width: 2.5;
        stroke-dasharray: 6 6;
        animation: flowWire 1s linear infinite;
      }
      .pulse-beacon {
        animation: pulseBeacon 2s ease-in-out infinite;
      }
      @keyframes travelHop1 {
        0% { transform: translateX(0px); opacity: 0; }
        10% { opacity: 1; }
        45% { transform: translateX(290px); opacity: 1; }
        50% { transform: translateX(290px); opacity: 0; }
        100% { transform: translateX(290px); opacity: 0; }
      }
      @keyframes travelHop2 {
        0%, 50% { transform: translateX(0px); opacity: 0; }
        55% { opacity: 1; }
        90% { transform: translateX(290px); opacity: 1; }
        95% { transform: translateX(290px); opacity: 0; }
        100% { transform: translateX(290px); opacity: 0; }
      }
      @keyframes flowWire {
        to { stroke-dashoffset: -24; }
      }
      @keyframes pulseBeacon {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.15); opacity: 0.6; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="848" height="198" x="1" y="1" rx="14" fill="#070a0e" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Banner -->
  <text x="35" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1.5">STORE-AND-FORWARD DTN PACKET LIFECYCLE (HOP LIMIT: 7)</text>

  <!-- Wire Lines Between Nodes -->
  <line x1="130" y1="100" x2="420" y2="100" class="hop-wire-active"/>
  <line x1="420" y1="100" x2="710" y2="100" class="hop-wire-active"/>

  <!-- Animated Traveling Packets -->
  <g class="packet-1" transform="translate(130, 0)">
    <circle cx="0" cy="100" r="6" class="packet-dot"/>
    <rect x="-30" y="70" width="60" height="18" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9" font-weight="700" fill="#f8fafc" text-anchor="middle">0x4E E2EE</text>
  </g>
  <g class="packet-2" transform="translate(420, 0)">
    <circle cx="0" cy="100" r="6" class="packet-dot"/>
    <rect x="-30" y="70" width="60" height="18" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9" font-weight="700" fill="#f8fafc" text-anchor="middle">HOP 1</text>
  </g>

  <!-- Node 1: Originator -->
  <g transform="translate(130, 100)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="5" font-size="18" text-anchor="middle">📱</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">NODE A (SENDER)</text>
    <rect x="-55" y="52" width="110" height="20" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9.5" font-weight="600" fill="#f59e0b" text-anchor="middle">⏳ QUEUED LOCALLY</text>
  </g>

  <!-- Node 2: Intermediate Relay -->
  <g transform="translate(420, 100)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="5" font-size="18" text-anchor="middle">🏍️</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">NODE B (RELAY)</text>
    <rect x="-55" y="52" width="110" height="20" rx="4" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="0.8"/>
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">⇄ RELAYED (HOP 1)</text>
  </g>

  <!-- Node 3: Final Recipient -->
  <g transform="translate(710, 100)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="5" font-size="18" text-anchor="middle">🚙</text>
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">NODE C (RECIPIENT)</text>
    <rect x="-55" y="52" width="110" height="20" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="9.5" font-weight="600" fill="#10b981" text-anchor="middle">✓✓ DELIVERED</text>
  </g>
</svg>
