<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0e"/>
      <stop offset="50%" stop-color="#0c1117"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>

    <!-- Accent Blue Gradient -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="tacticalGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.5"/>
    </pattern>

    <style>
      .glow-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 6px;
        fill: #f8fafc;
        animation: pulseTitle 4s ease-in-out infinite alternate;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: 3px;
        fill: #38bdf8;
      }
      .beacon-dot {
        fill: #10b981;
        animation: beaconBlink 2s ease-in-out infinite;
      }
      .beacon-ring {
        fill: none;
        stroke: #10b981;
        stroke-width: 1.5;
        animation: ripple 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-origin: 125px 42px;
      }
      .signal-wave {
        stroke: #38bdf8;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-dasharray: 8 6;
        animation: dashMove 1.5s linear infinite;
      }
      .tag-box {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      @keyframes pulseTitle {
        0% { filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.3)); }
        100% { filter: drop-shadow(0 0 16px rgba(56, 189, 248, 0.85)); }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.9); }
      }
      @keyframes ripple {
        0% { r: 4px; opacity: 1; }
        100% { r: 16px; opacity: 0; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -28; }
      }
      @keyframes sweepRadar {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect width="848" height="238" x="1" y="1" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="848" height="238" x="1" y="1" rx="14" fill="url(#tacticalGrid)"/>

  <!-- Tactical Corner Crosshairs -->
  <path d="M 20 30 L 20 20 L 30 20" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 830 30 L 830 20 L 820 20" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 20 210 L 20 220 L 30 220" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 830 210 L 830 220 L 820 220" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Live Status Beacon -->
  <circle class="beacon-ring" cx="125" cy="42" r="6"/>
  <circle class="beacon-dot" cx="125" cy="42" r="4.5"/>
  <text x="142" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1.5">OFFLINE MESH RADIO ACTIVE · ZERO INTERNET</text>

  <!-- Main Title -->
  <text x="50" y="108" class="glow-title" font-size="38">NOMAD LINK</text>
  
  <!-- Subtitle -->
  <text x="52" y="136" class="tagline" font-size="12">NO SIGNAL. NO LIMITS. · TACTICAL EXPEDITION PROTOCOL</text>

  <!-- Animated Signal Carrier Wave -->
  <path class="signal-wave" d="M 50 162 Q 75 148, 100 162 T 150 162 T 200 162 T 250 162 T 300 162 T 350 162 T 400 162 T 450 162 T 500 162 T 550 162 T 600 162 T 650 162 T 700 162 T 750 162 T 800 162" opacity="0.6"/>

  <!-- Capabilities Badges Footer -->
  <g transform="translate(50, 185)">
    <!-- Badge 1: BLE Mesh -->
    <rect x="0" y="0" width="120" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="60" y="17" class="tag-box" fill="#38bdf8" text-anchor="middle">📡 BLE 5.4 MESH</text>

    <!-- Badge 2: Wi-Fi Direct -->
    <rect x="130" y="0" width="140" height="26" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="200" y="17" class="tag-box" fill="#38bdf8" text-anchor="middle">⚡ WI-FI DIRECT P2P</text>

    <!-- Badge 3: E2EE Ed25519 -->
    <rect x="280" y="0" width="150" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="355" y="17" class="tag-box" fill="#10b981" text-anchor="middle">🔒 E2EE X25519/CHACHA</text>

    <!-- Badge 4: Dead Reckoning -->
    <rect x="440" y="0" width="150" height="26" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="515" y="17" class="tag-box" fill="#f59e0b" text-anchor="middle">🧭 SENSOR FUSION DR</text>

    <!-- Badge 5: Store & Forward -->
    <rect x="600" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="672" y="17" class="tag-box" fill="#a78bfa" text-anchor="middle">⏳ STORE &amp; FORWARD</text>
  </g>
</svg>
